version: '3.1'
services:
    zoneminder:
        container_name: zoneminder
        image: zoneminder:1.36
        restart: unless-stopped
        ports:
            - 8080:80
#        network_mode: "bridge"
#        privileged: true
        shm_size: 512M
        environment:
            - TZ=${TZ:-Europe/Berlin}
        volumes:
            - events:/var/cache/zoneminder/events
            - images:/var/cache/zoneminder/images
            - mysql:/var/lib/mysql
            - logs:/var/log/zm
volumes:
  events:
  images:
  mysql:
  logs:
